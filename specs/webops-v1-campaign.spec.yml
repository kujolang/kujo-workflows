name: "Kujo WebOps v1 ecosystem campaign"
version: "1.0.0"
status: "in-progress"
created_at: "2026-08-11T04:00:00-04:00"
priority: "critical"
goal: "Build, validate, publish, and dogfood the first operational Kujo WebOps ecosystem: SiteProbe, SearchBridge, ContentGraph, 28 peer agent contracts, reusable domain skills, ten fixture-first workflows, portable history and capability contracts, and the live agents.kujolang.ai WebOps collection."
background: "WebOps is the composable website-operations layer for continuous research, measurement, audit, maintenance, optimization, and improvement. Existing Kujo primitives remain authoritative for contracts, orchestration, evidence, evaluation, browser QA, retrieval, execution, receipts, telemetry, generation, and publishing."
scope: "Create three tool repositories; extend kujo-agents, kujo-skills, kujo-workflows, and agents.kujolang.ai; provide deterministic cross-repository validation; deploy through the existing GitHub Pages workflow; verify every public route; and retain evidence for the completed campaign."
non_goals:
  - "Build a WebOps commander or a second general orchestration engine."
  - "Replace Scout, Lens, RAG, Spec, Eval, Dispatch, RunLedger, CaseFile, SSG, CMS, or Howl."
  - "Build the future Publishing House or a SourceLedger/ClaimLedger implementation."
  - "Require paid data providers or custom WebOps portraits."
  - "Claim guaranteed indexing, complete WCAG conformance, causation, fabricated rankings, or fabricated provider availability."
relevant_systems:
  - "kujolang/siteprobe"
  - "kujolang/searchbridge"
  - "kujolang/contentgraph"
  - "kujolang/kujo-agents"
  - "kujolang/kujo-skills"
  - "kujolang/kujo-workflows"
  - "kujolang/agents.kujolang.ai"
  - "Kujo Spec, Eval, Scout, Scent, RAG, Dispatch, RunLedger, CaseFile, Lens, Workcell, Relay, Redact, Muzzle, PackWrite, PatchBrief, ChangeBucket, ShipCheck, Fence, Watchdog, SSG, SiteKit, CMS, Howl, MCP, Agents SDK, and AI SDK"
dependencies:
  - "Local Kujo runtime at ../kujo/target/release/kujo"
  - "Authenticated GitHub access to the kujolang organization"
  - "Existing agents.kujolang.ai GitHub Pages deployment"
acceptance_criteria:
  - "SiteProbe deterministically crawls bounded same-origin sites, respects robots by default, emits versioned artifacts, validates and compares runs, passes fixture tests, and completes a safe live smoke."
  - "SearchBridge exposes normalized capability families with honest no-credential degradation; GSC, GA4, PageSpeed, CrUX, IndexNow, Bing, and Ahrefs adapters have fixture coverage and explicit read/write boundaries."
  - "ContentGraph consumes SiteProbe/source/SearchBridge evidence, builds a deterministic lexical content graph, and reports orphans, clusters, overlap, link opportunities, and comparisons without requiring an LLM."
  - "kujo-agents contains exactly 28 WebOps peer packages with complete contracts, role-routing skills, shared permission/capability/history documentation, and a validated machine-readable catalog while Chain of Command remains valid."
  - "kujo-skills contains validated tool and WebOps methodology skills, updated indexes and routing fixtures, and no dangling agent/tool/workflow references."
  - "kujo-workflows contains ten runnable fixture-first WebOps kits, generalized site-profile/history schemas, catalog entries, evidence outputs, approval boundaries, and offline validation."
  - "agents.kujolang.ai safely synchronizes multiple canonical agent sets, builds and validates all existing Chain of Command pages plus all 28 WebOps pages, and uses the existing fallback visual for WebOps."
  - "The WebOps collection and all individual routes are deployed and verified live without breaking existing Chain of Command routes."
  - "A credential-free workflow dogfoods SiteProbe and ContentGraph against agents.kujolang.ai; SearchBridge doctor and capabilities report missing integrations without failure."
  - "Security review finds no committed credentials, unsafe default ACT behavior, cross-origin crawl sprawl, unbounded provider costs, output-path escapes, or implicit search submission."
  - "All intended repositories are clean, committed in small meaningful commits, and pushed without force or unrelated history changes."
eval_requirements:
  - description: "Run the repository-owned WebOps campaign validator."
    check_type: "command_succeeds"
    params:
      command: "bash scripts/validate-webops-campaign.sh"
  - description: "Validate this campaign contract strictly."
    check_type: "command_succeeds"
    params:
      command: "KUJO_BIN=../kujo/target/release/kujo ../spec/scripts/spec validate specs/webops-v1-campaign.spec.yml --strict"
  - description: "Verify live WebOps collection status."
    check_type: "http_status"
    params:
      url: "https://agents.kujolang.ai/agents/webops/"
      status: 200
risks:
  - risk: "Provider credentials or third-party APIs are unavailable."
    mitigation: "Make fixture/no-credential operation authoritative; capability preflight reports unavailable modules and skips only dependent analysis."
    severity: "medium"
  - risk: "Multi-set content synchronization deletes another agent set."
    mitigation: "Use a manifest-owned destination set and delete stale pages only within the selected set's managed slugs; test preservation both directions."
    severity: "high"
  - risk: "Crawler expands beyond the authorized site or writes outside its output root."
    mitigation: "Default to same-origin, robots-respecting, read-only requests; normalize and validate URLs and output paths; never submit forms."
    severity: "critical"
  - risk: "Cross-repository documentation drifts from executable behavior."
    mitigation: "Generate or validate catalogs against canonical contracts, schemas, commands, skill identities, workflow identities, and public routes."
    severity: "high"
review_expectations:
  - "Review every provider and ACT boundary for secret leakage and unintended mutation."
  - "Review generated agent contracts for narrow scope, honest degradation, evidence requirements, handoffs, escalation, and stop conditions."
  - "Review live Pages output only after local SSG, route, link, metadata, and browser checks pass."
human_approval_points:
  - "Explicit ACT authority is required at runtime for source mutation, commits, pull requests, content publishing, distribution publishing, or search submission; this campaign authorizes only its own scoped repository changes and existing Pages deployment."
  - "Optional provider credentials must be supplied out of band by their owner and are never required for fixture validation."
tags:
  - "webops"
  - "multi-repo"
  - "website-intelligence"
  - "agents"
  - "skills"
  - "workflows"
  - "github-pages"
